<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Collections - CarryMe Store</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            color: #f5f5f5;
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, #2d1810 0%, #1a0f0a 100%);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #d4af37;
            text-decoration: none;
        }

        nav a {
            color: #f5f5f5;
            text-decoration: none;
            margin-left: 30px;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #d4af37;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .section-title {
            text-align: center;
            font-size: 42px;
            color: #d4af37;
            margin-bottom: 50px;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            padding-bottom: 20px;
        }

        .section-title::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 2px;
            background: #d4af37;
        }

        .filter-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 40px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 10px 25px;
            border: 2px solid #d4af37;
            background: transparent;
            color: #d4af37;
            cursor: pointer;
            border-radius: 25px;
            transition: all 0.3s;
            font-size: 14px;
            font-weight: bold;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: #d4af37;
            color: #1a1a1a;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        .product-card {
            background: linear-gradient(135deg, #2d2d2d 0%, #1f1f1f 100%);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            transition: all 0.3s;
            border: 1px solid #404040;
        }

        .product-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 40px rgba(212, 175, 55, 0.2);
            border-color: #d4af37;
        }

        .product-image {
            position: relative;
            width: 100%;
            height: 300px;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            overflow: hidden;
        }

        .product-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .product-card:hover .product-image img {
            transform: scale(1.1);
        }

        .product-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #d4af37;
            color: #1a1a1a;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .product-info {
            padding: 25px;
        }

        .product-name {
            font-size: 20px;
            color: #d4af37;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .product-description {
            font-size: 14px;
            color: #b0b0b0;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .product-price {
            font-size: 24px;
            color: #d4af37;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .product-rating {
            color: #d4af37;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .product-actions {
            display: flex;
            gap: 10px;
        }

        .btn-add-cart {
            flex: 1;
            padding: 12px;
            background: #d4af37;
            color: #1a1a1a;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-add-cart:hover {
            background: #e5c158;
            transform: scale(1.05);
        }

        .btn-wishlist {
            padding: 12px 15px;
            background: transparent;
            border: 2px solid #d4af37;
            color: #d4af37;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-wishlist:hover {
            background: #d4af37;
            color: #1a1a1a;
        }

        footer {
            background: #1a0f0a;
            color: #d4af37;
            text-align: center;
            padding: 30px;
            margin-top: 50px;
            border-top: 2px solid #d4af37;
        }

        .footer-launch {
            background: linear-gradient(135deg, #d4af37 0%, #e5c158 100%);
            color: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        @media (max-width: 768px) {
            .products-grid {
                grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            }

            .section-title {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html" class="logo">✦ CarryMe Store ✦</a>
            <nav>
                <a href="index.html">Home</a>
                <a href="products.html">Collections</a>
                <a href="videos.html">Videos</a>
                <a href="checkout.html">Cart</a>
            </nav>
        </div>
    </header>

    <div class="container">
        <h1 class="section-title">Our Collections</h1>

        <div class="filter-buttons">
            <button class="filter-btn active" onclick="filterProducts('all')">All Products</button>
            <button class="filter-btn" onclick="filterProducts('jewelry')">Jewelry</button>
            <button class="filter-btn" onclick="filterProducts('towel')">Towels</button>
            <button class="filter-btn" onclick="filterProducts('home')">Home Decor</button>
        </div>

        <div class="products-grid" id="productsGrid">
            <!-- Products will be loaded here -->
        </div>
    </div>

    <footer>
        <div class="footer-launch">
            🚀 Site is Under Launch - Exciting Collections Coming Soon!
        </div>
        <p>&copy; 2026 CarryMe Store. Elevate Your Everyday. All rights reserved.</p>
    </footer>

    <script>
        // Product Data
        const products = [
            {
                id: 1,
                name: 'Handcrafted Terracotta Pendant Set',
                category: 'jewelry',
                price: '₹599',
                originalPrice: '₹899',
                image: 'https://via.placeholder.com/300x300?text=Terracotta+Jewelry',
                description: 'Traditional handcrafted terracotta pendant with intricate tribal design and adjustable cord',
                rating: '★★★★★ (38 reviews)',
                badge: 'Bestseller'
            },
            {
                id: 2,
                name: 'Premium Gym Towel Set',
                category: 'towel',
                price: '₹549',
                originalPrice: '₹799',
                image: 'https://via.placeholder.com/300x300?text=Gym+Towel',
                description: 'Ultra-absorbent, quick-dry microfiber gym towel. Available in black, navy, and grey. Perfect for workouts',
                rating: '★★★★☆ (42 reviews)',
                badge: 'New'
            },
            {
                id: 3,
                name: 'White Cotton Towel Set',
                category: 'towel',
                price: '₹449',
                originalPrice: '₹649',
                image: 'https://via.placeholder.com/300x300?text=White+Towel',
                description: '100% cotton white towels, machine washable, soft & durable. Pack of 2',
                rating: '★★★★★ (28 reviews)',
                badge: ''
            },
            {
                id: 4,
                name: 'Luxury Spa Towel Collection',
                category: 'towel',
                price: '₹799',
                originalPrice: '₹1199',
                image: 'https://via.placeholder.com/300x300?text=Spa+Towel',
                description: 'Premium Egyptian cotton spa towels with elegant lace trim. Perfect for gifting',
                rating: '★★★★★ (35 reviews)',
                badge: 'Premium'
            },
            {
                id: 5,
                name: 'Elegant Quilted Sofa Cover',
                category: 'home',
                price: '₹699',
                originalPrice: '₹999',
                image: 'https://via.placeholder.com/300x300?text=Sofa+Cover',
                description: 'Quilted polyester sofa protector with lace trim. Protects furniture from wear and stains',
                rating: '★★★★☆ (31 reviews)',
                badge: 'Popular'
            }
        ];

        function displayProducts(productsToShow) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';

            productsToShow.forEach(product => {
                const productCard = document.createElement('div');
                productCard.className = 'product-card';
                productCard.innerHTML = `
                    <div class="product-image">
                        <img src="${product.image}" alt="${product.name}">
                        ${product.badge ? `<div class="product-badge">${product.badge}</div>` : ''}
                    </div>
                    <div class="product-info">
                        <h3 class="product-name">${product.name}</h3>
                        <p class="product-description">${product.description}</p>
                        <div class="product-rating">${product.rating}</div>
                        <div class="product-price">
                            ${product.price}
                            <span style="font-size: 14px; color: #777; text-decoration: line-through; margin-left: 10px;">${product.originalPrice}</span>
                        </div>
                        <div class="product-actions">
                            <button class="btn-add-cart" onclick="addToCart(${product.id})">Add to Cart</button>
                            <button class="btn-wishlist" onclick="addToWishlist(${product.id})">♡</button>
                        </div>
                    </div>
                `;
                grid.appendChild(productCard);
            });
        }

        function filterProducts(category) {
            // Update button states
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Filter and display
            if (category === 'all') {
                displayProducts(products);
            } else {
                const filtered = products.filter(p => p.category === category);
                displayProducts(filtered);
            }
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            alert(`${product.name} added to cart!`);
            // Add actual cart logic here
        }

        function addToWishlist(productId) {
            const product = products.find(p => p.id === productId);
            alert(`${product.name} added to wishlist!`);
        }

        // Load products on page load
        displayProducts(products);
    </script>
</body>
</html>
