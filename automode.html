<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CarryMe Auto Mode - Auto-rotating product showcase of home appliances, jewelry, kids fashion & home decor">
    <meta name="keywords" content="product showcase, auto carousel, home decor, jewelry, kids fashion">
    <meta name="author" content="CarryMe">
    <title>CarryMe - Auto Mode Product Showcase</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            background: #f0f0f0;
            overflow: hidden;
        }

        .fullscreen-container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        .automode-viewer {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .image-display {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            background: white;
            margin: 1rem;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        .image-carousel {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .carousel-item {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 1s ease-in-out;
            animation: fadeIn 0.8s ease-in-out;
        }

        .carousel-item.active {
            opacity: 1;
        }

        .carousel-item img {
            max-width: 90%;
            max-height: 90%;
            object-fit: contain;
            border-radius: 10px;
        }

        .carousel-item.placeholder {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-size: 5rem;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .product-info {
            background: white;
            padding: 2rem;
            margin: 1rem;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            min-height: 200px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .product-title {
            font-size: 2.5rem;
            color: #e74c3c;
            margin-bottom: 1rem;
            font-weight: bold;
        }

        .product-category {
            font-size: 1.2rem;
            color: #667eea;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .product-description {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 1.5rem;
            line-height: 1.6;
        }

        .product-price {
            font-size: 1.8rem;
            color: #e74c3c;
            font-weight: bold;
            margin: 1rem 0;
        }

        .counter {
            font-size: 1rem;
            color: #999;
            margin-top: 1rem;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            padding: 1rem;
            background: rgba(255,255,255,0.1);
            flex-wrap: wrap;
        }

        .control-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 1rem 2rem;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .control-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            background: #667eea;
            color: white;
        }

        .control-btn.active {
            background: #e74c3c;
            color: white;
        }

        .progress-bar {
            height: 4px;
            background: rgba(255,255,255,0.2);
            margin-top: 0.5rem;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #25d366, #e74c3c);
            animation: progress 10s linear infinite;
            border-radius: 2px;
        }

        .progress-fill.paused {
            animation: none;
        }

        @keyframes progress {
            from {
                width: 0%;
            }
            to {
                width: 100%;
            }
        }

        .top-info {
            padding: 1rem;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.3);
        }

        .top-info h1 {
            font-size: 1.8rem;
        }

        .status {
            font-size: 1rem;
            background: rgba(255,255,255,0.2);
            padding: 0.5rem 1rem;
            border-radius: 20px;
        }

        .indicators {
            display: flex;
            justify-content: center;
            gap: 0.5rem;
            padding: 1rem;
            flex-wrap: wrap;
        }

        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255,255,255,0.4);
            cursor: pointer;
            transition: all 0.3s;
        }

        .indicator.active {
            background: white;
            width: 30px;
            border-radius: 6px;
        }

        .indicator:hover {
            background: rgba(255,255,255,0.8);
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .fullscreen-container {
                flex-direction: column;
            }

            .automode-viewer {
                flex: none;
                height: 100vh;
            }

            .product-title {
                font-size: 1.8rem;
            }

            .product-description {
                font-size: 0.95rem;
            }

            .product-price {
                font-size: 1.5rem;
            }

            .controls {
                gap: 0.5rem;
            }

            .control-btn {
                padding: 0.8rem 1.5rem;
                font-size: 0.9rem;
            }

            .image-display,
            .product-info {
                margin: 0.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="fullscreen-container">
        <div class="automode-viewer">
            <!-- Top Info -->
            <div class="top-info">
                <h1>🛍️ CarryMe - Product Showcase</h1>
                <div class="status" id="autoStatus">Auto Mode: ON</div>
            </div>

            <!-- Image Display Area -->
            <div class="image-display">
                <div class="image-carousel" id="carousel">
                    <!-- Carousel items will be inserted here -->
                </div>
            </div>

            <!-- Progress Bar -->
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>

            <!-- Indicators -->
            <div class="indicators" id="indicators"></div>

            <!-- Product Information -->
            <div class="product-info">
                <div class="product-category" id="category">Home Decor</div>
                <div class="product-title" id="title">Premium Home Decor</div>
                <div class="product-description" id="description">Beautiful products for your home</div>
                <div class="product-price" id="price">₹999</div>
                <div class="counter">
                    <span id="currentItem">1</span> / <span id="totalItems">0</span>
                </div>
            </div>

            <!-- Controls -->
            <div class="controls">
                <button class="control-btn" id="playPauseBtn" onclick="toggleAutoPlay()">⏸️ Pause</button>
                <button class="control-btn" onclick="previousItem()">⬅️ Previous</button>
                <button class="control-btn" onclick="nextItem()">Next ➡️</button>
                <button class="control-btn" onclick="goHome()">🏠 Home</button>
            </div>
        </div>
    </div>

    <script>
        // Product Data
        const products = [
            {
                name: "Sofa Cover",
                category: "Home Appliances",
                description: "Premium quality sofa cover, protective and stylish",
                image: "Sofa cover.png",
                price: "₹1,299"
            },
            {
                name: "Face Towel",
                category: "Kids Fashion",
                description: "Soft and comfortable face towel for daily use",
                image: "face towel.png",
                price: "₹599"
            },
            {
                name: "Sport Towel",
                category: "Home Decor",
                description: "Durable sport towel perfect for gym and outdoor activities",
                image: "sport towel.png",
                price: "₹799"
            },
            {
                name: "Home Decor",
                category: "Home Decor",
                description: "Beautiful home decor items to enhance your living space",
                image: "home decor.png",
                price: "₹1,499"
            },
            {
                name: "WhatsApp Special Offer",
                category: "Limited Time",
                description: "Contact us on WhatsApp for exclusive deals and offers",
                image: "WhatsApp Image 2026-06-02 at 7.28.00 PM.jpeg",
                price: "Special Price"
            },
            {
                name: "Premium Collection",
                category: "Featured",
                description: "Explore our premium collection of exclusive products",
                image: "WhatsApp Image 2026-06-02 at 7.28.01 PM.jpeg",
                price: "Best Value"
            },
            {
                name: "Product Showcase",
                category: "Featured",
                description: "High-quality products showcasing our best selection",
                image: "image0.png",
                price: "Premium Quality"
            }
        ];

        let currentIndex = 0;
        let isAutoPlay = true;
        let autoPlayTimer;

        function initCarousel() {
            const carousel = document.getElementById('carousel');
            const indicators = document.getElementById('indicators');
            
            // Create carousel items
            products.forEach((product, index) => {
                const item = document.createElement('div');
                item.className = `carousel-item ${index === 0 ? 'active' : ''}`;
                
                const img = document.createElement('img');
                img.src = product.image;
                img.alt = product.name;
                img.onerror = function() {
                    this.parentElement.innerHTML = `<div style="font-size: 5rem; opacity: 0.3;">📦</div>`;
                };
                
                item.appendChild(img);
                carousel.appendChild(item);

                // Create indicators
                const indicator = document.createElement('div');
                indicator.className = `indicator ${index === 0 ? 'active' : ''}`;
                indicator.onclick = () => goToItem(index);
                indicators.appendChild(indicator);
            });

            document.getElementById('totalItems').textContent = products.length;
            updateProductInfo(0);
            startAutoPlay();
        }

        function updateProductInfo(index) {
            const product = products[index];
            document.getElementById('category').textContent = product.category;
            document.getElementById('title').textContent = product.name;
            document.getElementById('description').textContent = product.description;
            document.getElementById('price').textContent = product.price;
            document.getElementById('currentItem').textContent = index + 1;
        }

        function goToItem(index) {
            const items = document.querySelectorAll('.carousel-item');
            const indicators = document.querySelectorAll('.indicator');
            
            items.forEach(item => item.classList.remove('active'));
            indicators.forEach(ind => ind.classList.remove('active'));
            
            items[index].classList.add('active');
            indicators[index].classList.add('active');
            
            currentIndex = index;
            updateProductInfo(index);
            
            // Reset timer
            if (isAutoPlay) {
                clearTimeout(autoPlayTimer);
                startAutoPlay();
            }
        }

        function nextItem() {
            const nextIndex = (currentIndex + 1) % products.length;
            goToItem(nextIndex);
        }

        function previousItem() {
            const prevIndex = (currentIndex - 1 + products.length) % products.length;
            goToItem(prevIndex);
        }

        function toggleAutoPlay() {
            isAutoPlay = !isAutoPlay;
            const btn = document.getElementById('playPauseBtn');
            const status = document.getElementById('autoStatus');
            const progressFill = document.getElementById('progressFill');
            
            if (isAutoPlay) {
                btn.textContent = '⏸️ Pause';
                btn.classList.add('active');
                status.textContent = 'Auto Mode: ON';
                progressFill.classList.remove('paused');
                startAutoPlay();
            } else {
                btn.textContent = '▶️ Play';
                btn.classList.remove('active');
                status.textContent = 'Auto Mode: OFF';
                progressFill.classList.add('paused');
                clearTimeout(autoPlayTimer);
            }
        }

        function startAutoPlay() {
            autoPlayTimer = setTimeout(() => {
                nextItem();
            }, 10000); // Change every 10 seconds
        }

        function goHome() {
            window.location.href = 'index.html';
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextItem();
            if (e.key === 'ArrowLeft') previousItem();
            if (e.key === ' ') {
                e.preventDefault();
                toggleAutoPlay();
            }
            if (e.key === 'h' || e.key === 'H') goHome();
        });

        // Initialize on load
        window.addEventListener('load', initCarousel);

        // Auto-advance when tab is visible
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                clearTimeout(autoPlayTimer);
            } else if (isAutoPlay) {
                startAutoPlay();
            }
        });
    </script>
</body>
</html>
