<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarryMe Store | Premium Collection</title>
    <style>
        /* Aesthetic Color Palette */
        :root {
            --bg-color: #f5efe7;
            --card-bg: #ffffff;
            --text-color: #2c2c2c;
            --accent: #000000;
        }

        body { font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 40px 20px; }
        
        header { text-align: center; margin-bottom: 50px; }
        h1 { font-weight: 300; letter-spacing: 2px; text-transform: uppercase; }

        .catalog-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 40px; 
            max-width: 1200px; 
            margin: 0 auto; 
        }

        .product-card { 
            background: var(--card-bg); 
            padding: 20px; 
            border-radius: 4px; 
            transition: opacity 0.3s;
            text-align: left;
        }

        .product-card img { width: 100%; height: 350px; object-fit: cover; border-radius: 2px; margin-bottom: 15px; }
        .product-card h3 { font-weight: 500; margin: 10px 0; font-size: 1.1rem; }
        .product-card p { font-weight: bold; margin-bottom: 20px; }

        .btn-whatsapp { 
            display: block; width: 100%; padding: 14px; background: var(--accent); 
            color: #fff; text-align: center; text-decoration: none; 
            text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1.5px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Our Collection</h1>
    </header>

    <main id="catalog" class="catalog-grid"></main>

    <script>
        const products = [
            { name: "Sofa Cover", price: "₹499", img: "sofa-cover.png" },
            { name: "Face Towel", price: "₹199", img: "face-towel.png" }
        ];

        const catalog = document.getElementById('catalog');
        products.forEach(product => {
            catalog.innerHTML += `
                <div class="product-card">
                    <img src="${product.img}" alt="${product.name}">
                    <h3>${product.name}</h3>
                    <p>${product.price}</p>
                    <a href="https://wa.me/919250036334?text=I%20want%20to%20order%20the%20${product.name}" class="btn-whatsapp">Add to Cart</a>
                </div>
            `;
        });
    </script>
</body>
</html>
