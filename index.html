<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarryMe Store</title>
    <meta http-equiv="refresh" content="0;url=https://carryme-stores.streamlit.app/">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background: #f5f5f5; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #667eea; }
        a { color: #764ba2; text-decoration: none; font-weight: bold; }
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #764ba2; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛍️ CarryMe Store</h1>
        <p>India's Premium Home Decor & Lifestyle Store</p>
        <div class="spinner"></div>
        <p>Redirecting to our store...</p>
        <p>If you are not redirected, <a href="https://carryme-stores.streamlit.app/">click here</a>.</p>
    </div>
</body>
</html>
