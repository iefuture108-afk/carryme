<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarryMe Store | Premium AI-Native Shopping</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">

    <header class="bg-white shadow-sm p-4 sticky top-0 z-50">
        <h1 class="text-xl font-bold text-blue-600">CarryMe Store</h1>
    </header>

    <main class="p-4 max-w-sm mx-auto">
        <div class="bg-white rounded-xl shadow-md overflow-hidden">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500" alt="Product" class="w-full h-64 object-cover">
            <div class="p-4">
                <h2 class="text-lg font-semibold">Premium Product Name</h2>
                <p class="text-gray-600 mt-2">Special AI-curated product for your daily needs.</p>
                <div class="mt-4 text-2xl font-bold text-blue-700">₹999</div>
            </div>
        </div>
    </main>

    <footer class="fixed bottom-0 w-full p-4 bg-white border-t">
        <a href="https://wa.me/91XXXXXXXXXX?text=I%20want%20to%20order%20the%20Premium%20Product" 
           class="block w-full bg-green-500 text-white text-center py-3 rounded-lg font-bold shadow-lg">
           Order on WhatsApp 🛒
        </a>
    </footer>

</body>
</html>
